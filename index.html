<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUATEMALA-RP Discord</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #0a0e27;
            color: white;
            overflow: hidden;
        }

        /* Botón brillante estilo tecnológico */
        .btn-discord {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 40px;
            font-size: 18px;
            text-decoration: none;
            border-radius: 50px;
            background: linear-gradient(45deg, #7289da, #99aab5);
            color: white;
            box-shadow: 0 0 20px #7289da;
            transition: 0.3s;
            z-index: 10;
            border: none;
            cursor: pointer;
        }

        .btn-discord:hover {
            box-shadow: 0 0 40px #99aab5, 0 0 60px #7289da;
            transform: translate(-50%, -50%) scale(1.1);
        }

        /* Canvas full-screen para partículas */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>
    <!-- Fondo de partículas -->
    <canvas id="particles"></canvas>

    <!-- Botón Discord animado -->
    <a href="https://discord.gg/bA2JQp6z" class="btn-discord" target="_blank">💬 Únete a nuestro Discord</a>

    <script>
        // Simple partículas flotantes
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particlesArray = [];
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if(this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if(this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = '#7289da';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles(){
            for(let i = 0; i < 100; i++) particlesArray.push(new Particle());
        }

        function animate(){
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(p => {p.update(); p.draw();});
            requestAnimationFrame(animate);
        }

        initParticles();
        animate();

        // Redimensionar canvas cuando cambia el tamaño de la ventana
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
